name: Build PumpkinMC for Android ARM64

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Official PumpkinMC Source Code
        uses: actions/checkout@v4
        with:
          repository: 'Pumpkin-MC/Pumpkin'
          ref: 'master'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Install cargo-ndk
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y cargo-ndk

      - name: Compile Pumpkin for Android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo ndk -t arm64-v8a build --release

      - name: Upload Android Executable
        uses: actions/upload-artifact@v4
        with:
          name: pumpkin-android-arm64
          path: target/aarch64-linux-android/release/pumpkin
